name: Microsoft 365 Auth Repair - Windows x64 and ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'MODULES.lock'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'MODULES.lock'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: m365-auth-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-publish:
    runs-on: windows-2025
    env:
      MODULES_READ_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Checkout canonical UniversalUpdater
        if: ${{ env.MODULES_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/UniversalUpdater
          ref: a909a7dd033799f5e0783fb8085478c3e3b52c42
          token: ${{ secrets.MODULES_READ_TOKEN }}
          path: modules/UniversalUpdater
          persist-credentials: false
      - name: Checkout canonical UniversalDiagnostics
        if: ${{ env.MODULES_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/UniversalDiagnocticsModule
          ref: 16ce43a34fc99002f69bbf86673fb8e7c451c662
          token: ${{ secrets.MODULES_READ_TOKEN }}
          path: modules/UniversalDiagnocticsModule
          persist-credentials: false
      # Existing public snapshots are used when no private read token is configured.
      # They are pinned to reviewed commits, not floating branch names.
      - name: Checkout public UniversalUpdater snapshot
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/TermsrvPatcherUnified
          ref: 65cceb96cba8524ede659961df2e3814c9c5355c
          path: upstream/TermsrvPatcherUnified
          persist-credentials: false
      - name: Checkout public UniversalDiagnostics snapshot
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/BitKeyBridge
          ref: eac3178a627d524c92ef310f46d8c3b6c9fcd1af
          path: upstream/BitKeyBridge
          persist-credentials: false
      - name: Assemble public module snapshots
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $updaterSource = 'upstream/TermsrvPatcherUnified/Shared/UniversalUpdater.Core'
          $diagnosticsSource = 'upstream/BitKeyBridge/src/UniversalDiagnostics.Embedded/UniversalDiagnosticsEmbedded.vb'
          if (-not (Test-Path "$updaterSource/UniversalUpdater.Core.csproj") -or -not (Test-Path $diagnosticsSource)) {
            throw 'Pinned public module source path is unavailable.'
          }
          $updaterTarget = 'modules/UniversalUpdater/src/UniversalUpdater.Core'
          $diagnosticsTarget = 'modules/UniversalDiagnocticsModule/embedded/dotnet'
          New-Item -ItemType Directory -Force $updaterTarget, $diagnosticsTarget | Out-Null
          Copy-Item "$updaterSource/*" $updaterTarget -Recurse -Force
          Copy-Item $diagnosticsSource "$diagnosticsTarget/UniversalDiagnosticsEmbedded.vb" -Force
          Write-Host 'Using pinned public snapshots of existing UniversalUpdater and UniversalDiagnostics.'
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained x64 and ARM64 executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in @('win-x64','win-arm64')) {
            dotnet publish src/Microsoft365AuthRepair/Microsoft365AuthRepair.csproj -c Release -r $rid --self-contained true -o "publish/$rid" -p:PublishSingleFile=true -p:PublishAot=false -p:PublishTrimmed=false -p:PublishReadyToRun=false
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $rid" }
            $exe = "publish/$rid/Microsoft365AuthRepair.exe"
            if (-not (Test-Path $exe)) { throw "Missing EXE: $rid" }
            Compress-Archive -Path $exe -DestinationPath "artifacts/Microsoft365AuthRepair-$rid.zip" -Force
          }
          Get-ChildItem artifacts -Filter '*.zip' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Smoke-test x64 GUI initialization
        shell: pwsh
        run: |
          # PowerShell does not reliably wait for WinExe GUI programs or populate
          # LASTEXITCODE when invoked directly. Wait on its process handle.
          $selfTestExe = (Resolve-Path "publish/win-x64/Microsoft365AuthRepair.exe").Path
          $selfTest = Start-Process -FilePath $selfTestExe -ArgumentList '--ui-self-test' -PassThru -Wait
          if ($selfTest.ExitCode -ne 0) { throw "x64 GUI self-test failed: $($selfTest.ExitCode)" }
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft365AuthRepair-stable-v1.0.0-x64-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-stable-v1:
    name: Publish immutable v1.0.0 release
    needs: windows-publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download validated x64 and ARM64 build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Microsoft365AuthRepair-stable-v1.0.0-x64-arm64
          path: release-assets
      - name: Validate version, archive contents and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content src/Microsoft365AuthRepair/Microsoft365AuthRepair.csproj
          if ($project.Project.PropertyGroup.Version -ne '1.0.0') {
            throw 'Stable publishing requires exact version 1.0.0.'
          }
          if ((Get-Content src/Microsoft365AuthRepair/Repair.cs -Raw) -notmatch 'internal const string Version = "1.0.0";') {
            throw 'Repair runtime version does not match 1.0.0.'
          }
          $expected = @('Microsoft365AuthRepair-win-x64.zip', 'Microsoft365AuthRepair-win-arm64.zip')
          $checksums = Get-Content release-assets/SHA256SUMS.txt
          if ($checksums.Count -ne $expected.Count) { throw 'Unexpected SHA256SUMS format.' }
          Add-Type -AssemblyName System.IO.Compression
          foreach ($filename in $expected) {
            $full = Join-Path release-assets $filename
            if (-not (Test-Path $full)) { throw "Missing archive: $filename" }
            $hash = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checksums -notcontains "$hash  $filename") {
              throw "Checksum mismatch for $filename"
            }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $full).Path)
            try {
              if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne 'Microsoft365AuthRepair.exe') {
                throw "Unexpected ZIP structure: $filename"
              }
              if ($zip.Entries[0].Length -lt 1000000) { throw "Unexpected EXE size: $filename" }
            }
            finally { $zip.Dispose() }
          }
          Write-Host 'Stable 1.0.0 checksum and package validation passed.'
      - name: Publish GitHub stable release with downloadable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists: do not replace existing stable assets or tag."
            exit 0
          fi
          gh release create v1.0.0 \
            release-assets/Microsoft365AuthRepair-win-x64.zip \
            release-assets/Microsoft365AuthRepair-win-arm64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Microsoft 365 Auth Repair 1.0.0 (Stable)" \
            --notes-file docs/releases/v1.0.0.md \
            --latest
