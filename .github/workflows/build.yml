name: Microsoft 365 Auth Repair - Preview x64 and ARM64
on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'src/**'
      - 'MODULES.lock'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'MODULES.lock'
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: m365-auth-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-publish:
    runs-on: windows-2025
    env:
      MODULES_READ_TOKEN: ${{ secrets.MODULES_READ_TOKEN }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Checkout canonical UniversalUpdater
        if: ${{ env.MODULES_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/UniversalUpdater
          ref: a909a7dd033799f5e0783fb8085478c3e3b52c42
          token: ${{ secrets.MODULES_READ_TOKEN }}
          path: modules/UniversalUpdater
          persist-credentials: false
      - name: Checkout canonical UniversalDiagnostics
        if: ${{ env.MODULES_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/UniversalDiagnocticsModule
          ref: 16ce43a34fc99002f69bbf86673fb8e7c451c662
          token: ${{ secrets.MODULES_READ_TOKEN }}
          path: modules/UniversalDiagnocticsModule
          persist-credentials: false
      # Existing public snapshots are used when no private read token is configured.
      # They are pinned to reviewed commits, not floating branch names.
      - name: Checkout public UniversalUpdater snapshot
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/TermsrvPatcherUnified
          ref: 65cceb96cba8524ede659961df2e3814c9c5355c
          path: upstream/TermsrvPatcherUnified
          persist-credentials: false
      - name: Checkout public UniversalDiagnostics snapshot
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: sgennadi/BitKeyBridge
          ref: eac3178a627d524c92ef310f46d8c3b6c9fcd1af
          path: upstream/BitKeyBridge
          persist-credentials: false
      - name: Assemble public module snapshots
        if: ${{ env.MODULES_READ_TOKEN == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $updaterSource = 'upstream/TermsrvPatcherUnified/Shared/UniversalUpdater.Core'
          $diagnosticsSource = 'upstream/BitKeyBridge/src/UniversalDiagnostics.Embedded/UniversalDiagnosticsEmbedded.vb'
          if (-not (Test-Path "$updaterSource/UniversalUpdater.Core.csproj") -or -not (Test-Path $diagnosticsSource)) {
            throw 'Pinned public module source path is unavailable.'
          }
          $updaterTarget = 'modules/UniversalUpdater/src/UniversalUpdater.Core'
          $diagnosticsTarget = 'modules/UniversalDiagnocticsModule/embedded/dotnet'
          New-Item -ItemType Directory -Force $updaterTarget, $diagnosticsTarget | Out-Null
          Copy-Item "$updaterSource/*" $updaterTarget -Recurse -Force
          Copy-Item $diagnosticsSource "$diagnosticsTarget/UniversalDiagnosticsEmbedded.vb" -Force
          Write-Host 'Using pinned public snapshots of existing UniversalUpdater and UniversalDiagnostics.'
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained x64 and ARM64 executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in @('win-x64','win-arm64')) {
            dotnet publish src/Microsoft365AuthRepair/Microsoft365AuthRepair.csproj -c Release -r $rid --self-contained true -o "publish/$rid" -p:PublishSingleFile=true -p:PublishAot=false -p:PublishTrimmed=false -p:PublishReadyToRun=false
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $rid" }
            $exe = "publish/$rid/Microsoft365AuthRepair.exe"
            if (-not (Test-Path $exe)) { throw "Missing EXE: $rid" }
            Compress-Archive -Path $exe -DestinationPath "artifacts/Microsoft365AuthRepair-$rid.zip" -Force
          }
          Get-ChildItem artifacts -Filter '*.zip' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Parse protected PowerShell fallback without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path 'src/Microsoft365AuthRepair/Assets/WamReregisterWorker.ps1').Path
          $tokens = $null
          $problems = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$problems)
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Error $_.Message }
            throw "The PowerShell fallback has parser errors."
          }
          $source = Get-Content -LiteralPath $path -Raw
          if ($source -notmatch 'Add-AppxPackage' -or $source -match 'ExecutionPolicy Bypass' -or $source -match 'Remove-Item -Recurse') {
            throw 'The fallback script did not pass safe-mode source inspection.'
          }
          Write-Host 'PowerShell re-registration script syntax/intent checks passed (no WAM changes made).'
      - name: Smoke-test x64 GUI initialization
        shell: pwsh
        run: |
          # PowerShell does not reliably wait for WinExe GUI programs or populate
          # LASTEXITCODE when invoked directly. Wait on its process handle.
          $selfTestExe = (Resolve-Path "publish/win-x64/Microsoft365AuthRepair.exe").Path
          $selfTest = Start-Process -FilePath $selfTestExe -ArgumentList '--ui-self-test' -PassThru -Wait
          $diagnostic = Join-Path $env:TEMP 'Microsoft365AuthRepair-UiTest.txt'
          if (Test-Path -LiteralPath $diagnostic) { Get-Content -LiteralPath $diagnostic | Write-Host }
          if ($selfTest.ExitCode -ne 0) { throw "x64 GUI self-test failed: $($selfTest.ExitCode)" }
      - name: Reject invalid background-worker requests without touching WAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "publish/win-x64/Microsoft365AuthRepair.exe").Path
          foreach ($arguments in @('--first-logon INVALID', '--first-logon aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', '--cleanup-helper INVALID')) {
            $test = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -Wait
            if ($test.ExitCode -ne 2) {
              throw "Background worker accepted invalid input: $arguments ($($test.ExitCode))"
            }
          }
          Write-Host 'Invalid worker requests were rejected without running any repair.'
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft365AuthRepair-preview-x64-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14


  publish-preview:
    name: Publish signed-off Preview release
    needs: windows-publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/preview' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the tested preview commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch verified x64 and ARM64 packages
        uses: actions/download-artifact@v4
        with:
          name: Microsoft365AuthRepair-preview-x64-arm64
          path: release-assets
      - name: Validate preview version and both SHA-256 packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content src/Microsoft365AuthRepair/Microsoft365AuthRepair.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -cnotmatch '^1[.]0[.][1-9][0-9]*-preview[.][1-9][0-9]*$') {
            throw "Unexpected version for preview workflow: $version"
          }
          $repairVersion = Get-Content src/Microsoft365AuthRepair/Repair.cs -Raw
          if (-not $repairVersion.Contains('internal const string Version = "' + $version + '";')) {
            throw 'Preview runtime version and build metadata differ.'
          }
          $expected = @('Microsoft365AuthRepair-win-x64.zip', 'Microsoft365AuthRepair-win-arm64.zip')
          $checksums = @(Get-Content release-assets/SHA256SUMS.txt)
          if ($checksums.Count -ne 2) { throw 'SHA256SUMS must contain exactly two packages.' }
          foreach ($filename in $expected) {
            $path = Join-Path release-assets $filename
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing: $filename" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checksums -notcontains "$hash  $filename") { throw "Checksum mismatch: $filename" }
            Add-Type -AssemblyName System.IO.Compression
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path).Path)
            try {
              if ($archive.Entries.Count -ne 1 -or
                  $archive.Entries[0].FullName -cne 'Microsoft365AuthRepair.exe' -or
                  $archive.Entries[0].Length -lt 1000000) {
                throw "Invalid EXE package: $filename"
              }
            }
            finally { $archive.Dispose() }
          }
          Write-Host "Preview package verification passed: $version"
      - name: Create immutable-by-policy Preview GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Microsoft365AuthRepair/Microsoft365AuthRepair.csproj | head -1)"
          test "$version" = "1.0.2-preview.21"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing to overwrite a published preview."
            exit 0
          fi
          gh release create "$tag" \
            release-assets/Microsoft365AuthRepair-win-x64.zip \
            release-assets/Microsoft365AuthRepair-win-arm64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Microsoft 365 Auth Repair $version (Preview)" \
            --notes-file docs/releases/v1.0.2-preview.21.md \
            --prerelease
